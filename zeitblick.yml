name: Zeitblick Erinnerungen

on:
  schedule:
    - cron: '7 * * * *'   # stündlich
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: zeitblick
  cancel-in-progress: false

jobs:
  erinnerungen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Berlin
      ZB_GIST_TOKEN: ${{ secrets.ZB_GIST_TOKEN }}
      ZB_GIST_ID: ${{ secrets.ZB_GIST_ID }}
      ZB_APP_URL: ${{ vars.ZB_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Erinnerungen planen
        run: node server/zeitblick-server.mjs
      - name: Aktiv halten (GitHub pausiert Zeitpläne nach 60 Tagen ohne Commit)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 4320000 ]; then
            git config user.name "zeitblick-bot"
            git config user.email "zeitblick-bot@users.noreply.github.com"
            date -u > .github/keepalive
            git add .github/keepalive
            git commit -m "Zeitblick: Zeitplan aktiv halten"
            git push
          fi
