<script>
  // Farbmodus sofort setzen (kein Aufblitzen)
  try {
    var l = JSON.parse(localStorage.getItem('zb.local.v1') || '{}');
    var t = l.theme || 'auto', h = new Date().getHours();
    if (l.nightAuto && (h >= 21 || h < 6)) t = 'night';
    else if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<script src="vendor/qrcode.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body data-area="all">
<div id="app"><div style="display:grid;place-items:center;min-height:100vh;font-family:system-ui;color:#6b7784">Zeitblick lädt …</div></div>

</body>
